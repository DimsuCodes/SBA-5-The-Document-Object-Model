<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pieces of Me | Personal Blog</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1><img src="icons/logo-tree-hill.svg" alt="" width="48" height="48"> Pieces of Me</h1>
    </header>

    <main>
        <section aria-labelledby="formHeading">
            <h2 id="formHeading">New Post</h2>

            <form id="pom" novalidate>
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title" placeholder="Channel your inner zen~" maxlength="80" required aria-describedby="titleError">
                    <span id="titleError" class="error-message" aria-live="polite"></span>
                </div>

                <div class="form-group">
                    <label for="content">What's on your mind?</label>
                    <textarea id="content" name="content" rows="10" placeholder="Start cookin'" required aria-describedby="contentError"></textarea>
                    <span id="contentError" class="error-message" aria-live="polite"></span>
                </div>

                <button type="submit">Publish Your Post</button>
            </form>
        </section>

        <section aria-labelledby="postsHeading">
            <h2 id="postsHeading">My Posts</h2>
            <div id="postsContainer"></div>
        </section>
    </main>
</body>
</html>
